
name: Build LYNE for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Find LYNE package
        id: app
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path . -Filter package.json -Recurse -File |
            Where-Object { $_.FullName -notmatch 'node_modules|\.git' } |
            Select-Object -First 1

          if (-not $package) {
            throw "Could not find package.json. Upload the LYNE project files."
          }

          $folder = $package.Directory.FullName
          "app_dir=$folder" >> $env:GITHUB_OUTPUT
          Write-Host "Found LYNE at $folder"

      - name: Install dependencies
        working-directory: ${{ steps.app.outputs.app_dir }}
        run: pnpm install --no-frozen-lockfile

      - name: Build LYNE installer
        working-directory: ${{ steps.app.outputs.app_dir }}
        run: pnpm electron:build:win
        env:
          CI: "true"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: LYNE-Windows-Installer
          path: |
            ${{ steps.app.outputs.app_dir }}/release/*.exe
            ${{ steps.app.outputs.app_dir }}/release/*.blockmap
            ${{ steps.app.outputs.app_dir }}/release/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.app.outputs.app_dir }}/release/*.exe
            ${{ steps.app.outputs.app_dir }}/release/*.blockmap
            ${{ steps.app.outputs.app_dir }}/release/latest.yml
